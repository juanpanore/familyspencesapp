<div class="container" style="padding: 20px;"> <h2>Ranking Familiar</h2>
  
  <form [formGroup]="rankingForm" class="form-container" style="display: flex; gap: 15px; margin-bottom: 20px;">
    <div class="form-field">
      <label for="month" style="margin-right: 5px;">Mes:</label>
      <input id="month" type="number" formControlName="month" min="1" max="12" placeholder="MM">
    </div>
    <div class="form-field">
      <label for="year" style="margin-right: 5px;">Año:</label>
      <input id="year" type="number" formControlName="year" min="2020" placeholder="YYYY">
    </div>
  </form>

  <div class="button-group" style="margin-bottom: 20px;">
    <button (click)="onCalculate()" [disabled]="rankingForm.invalid" class="btn btn-primary" style="margin-right: 10px;">Calcular Ranking</button>
    <button (click)="onConsult()" [disabled]="rankingForm.invalid" class="btn btn-secondary">Consultar Ranking</button>
  </div>

  <div *ngIf="calculationMessage" class="feedback-message info" style="margin-bottom: 15px; color: blue;">{{ calculationMessage }}</div>
  <div *ngIf="consultMessage" class="feedback-message info" style="margin-bottom: 15px; color: green;">{{ consultMessage }}</div>

  <div *ngIf="rankingData.length > 0" class="table-container">
    <h3>Resultados para {{ rankingForm.value.year }}-{{ rankingForm.value.month | number:'2.0' }}</h3>
    <table style="width: 100%; border-collapse: collapse;">
      <thead>
        <tr style="background-color: #f4f4f4;">
          <th style="padding: 8px; border: 1px solid #ddd; text-align: left;">Usuario</th>
          <th style="padding: 8px; border: 1px solid #ddd; text-align: left;">Total Gastos</th>
          <th style="padding: 8px; border: 1px solid #ddd; text-align: left;">Total Ingresos</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of rankingData">
          <td style="padding: 8px; border: 1px solid #ddd;">{{ item.user }}</td>
          <td style="padding: 8px; border: 1px solid #ddd;">{{ item.totalExpenses | currency:'COP':'$' }}</td>
          <td style="padding: 8px; border: 1px solid #ddd;">{{ item.totalIncome | currency:'COP':'$' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
