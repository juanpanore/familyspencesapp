<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-content">
    <h3>Nueva Tarea</h3>

    <form (ngSubmit)="createTask()" class="form">
      <input [(ngModel)]="newTask.name" name="name" placeholder="Nombre de la tarea" required />

      <textarea
        [(ngModel)]="newTask.description"
        name="description"
        placeholder="Descripción"
        rows="3"
        required>
      </textarea>

      <label>💰 Gasto asociado:</label>
      <select [(ngModel)]="newTask.idExpenseve" name="idExpenseve" required>
        <option value="">-- Selecciona un gasto --</option>
        <option *ngFor="let e of expenses" [value]="e.id">
          {{ e.title }} | {{ e.description }} | {{ e.category }}
        </option>
      </select>

      <label>🏖️ Vacaciones (opcional):</label>
      <select [(ngModel)]="newTask.vacationId" name="vacationId">
        <option value="">-- Sin vacaciones --</option>
        <option *ngFor="let v of vacations" [value]="v.id">
          {{ v.destination || v.name }}
        </option>
      </select>

      <label>📅 Fecha de creación:</label>
      <input
        type="date"
        [(ngModel)]="newTask.creationDate"
        name="creationDate"
        required />

      <div class="checkbox-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            [(ngModel)]="newTask.status"
            name="status" />
          <span>✅ Marcar como completada</span>
        </label>
      </div>

      <div class="modal-buttons">
        <button type="submit">➕ Crear tarea</button>
        <button type="button" (click)="closeModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="tasks-container">
  <div class="header-row">
    <h2>📋 Mis Tareas</h2>
    <button class="btn-create-top" (click)="openModal()">➕ Nueva tarea</button>
  </div>

  <div *ngIf="tasks.length === 0" class="no-tasks">
    No hay tareas creadas aún
  </div>

  <div class="task-card" *ngFor="let task of tasks">
    <div class="task-header">
      <h4>{{ task.name }}</h4>
      <span class="task-status" [class.completed]="task.status">
        {{ task.status ? '✅ Completada' : '⏳ Pendiente' }}
      </span>
    </div>

    <p class="task-description">{{ task.description }}</p>

    <div class="task-meta">
      <span>📅 {{ task.creationDate }}</span>
    </div>

    <div class="task-actions">
      <button class="btn-toggle" (click)="toggleStatus(task)">
        {{ task.status ? 'Marcar pendiente' : 'Marcar completada' }}
      </button>
      <button class="btn-delete" (click)="deleteTask(task.id)">🗑️ Eliminar</button>
    </div>
  </div>
</div>
