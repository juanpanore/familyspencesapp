<div class="ranking-container">
  
  <div class="ranking-controls card">
    <h3>Gestión de Ranking</h3>
    <p>Genera o consulta el ranking de gastos e ingresos por mes.</p>
    
    <form [formGroup]="periodoForm" class="period-form">
      <label for="periodo">Selecciona el Período:</label>
      <input type="month" id="periodo" formControlName="periodo">
    </form>

    <div class="button-group">
      <button class="btn btn-secondary" (click)="onGenerar()" [disabled]="isLoading || periodoForm.invalid">
        <span *ngIf="!isLoading">Generar Ranking</span>
        <span *ngIf="isLoading">Generando...</span>
      </button>
      
      <button class="btn btn-primary" (click)="onConsultar()" [disabled]="isLoading || periodoForm.invalid">
        <span *ngIf="!isLoading">Consultar Ranking</span>
        <span *ngIf="isLoading">Consultando...</span>
      </button>
    </div>
    
    <div *ngIf="mensajeFeedback" class="feedback-message">
      {{ mensajeFeedback }}
    </div>
  </div>

  <div class="ranking-results">
    
    <div class="podium-card card green">
      <h2>🏆 Ranking de Ingresos</h2>
      <app-ranking-podium [rankingData]="rankingIngresos"></app-ranking-podium>
    </div>

    <div class="podium-card card red">
      <h2>💸 Ranking de Gastos</h2>
      <app-ranking-podium [rankingData]="rankingGastos"></app-ranking-podium>
    </div>
    
  </div>
</div>
