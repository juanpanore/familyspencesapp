<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-content">
    <h3>{{ isEditing ? 'Edit Category' : 'New Category' }}</h3>

    <form (ngSubmit)="saveCategory()" class="form">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" [(ngModel)]="selectedCategory.name" name="name" placeholder="Category Name"
          required>
      </div>

      <div class="form-group">
        <label for="type">Type:</label>
        <select id="type" [(ngModel)]="selectedCategory.type" name="type" required>
          <option *ngFor="let type of categoryTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budgetLimit">Budget Limit:</label>
        <input type="number" id="budgetLimit" [(ngModel)]="selectedCategory.budgetLimit" name="budgetLimit"
          placeholder="0.00">
      </div>

      <div class="form-group">
        <label for="budgetPeriod">Budget Period:</label>
        <select id="budgetPeriod" [(ngModel)]="selectedCategory.budgetPeriod" name="budgetPeriod">
          <option *ngFor="let period of budgetPeriods" [value]="period">{{ period }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="icon">Icon (Emoji):</label>
        <input type="text" id="icon" [(ngModel)]="selectedCategory.icon" name="icon" placeholder="🍔">
      </div>

      <div class="form-group">
        <label for="color">Color:</label>
        <input type="color" id="color" [(ngModel)]="selectedCategory.color" name="color">
      </div>

      <div class="modal-buttons">
        <button type="submit">{{ isEditing ? 'Update' : 'Create' }}</button>
        <button type="button" (click)="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="category-container">
  <div class="header-row">
    <h2>📂 Categories</h2>
    <button class="btn-create-top" (click)="openModal()">➕ New Category</button>
  </div>

  <div *ngIf="categories.length === 0" class="no-categories">
    No categories found.
  </div>

  <div class="category-grid">
    <div class="category-card" *ngFor="let cat of categories" [style.border-left-color]="cat.color">
      <div class="category-header">
        <h4><span [style.color]="cat.color">{{ cat.icon }}</span> {{ cat.name }}</h4>
        <span class="category-type">{{ cat.type }}</span>
      </div>

      <div class="category-details">
        <p><strong>Limit:</strong> {{ cat.budgetLimit | currency }} / {{ cat.budgetPeriod }}</p>
      </div>

      <div class="category-actions">
        <button class="btn-edit" (click)="selectCategory(cat)">✏️ Edit</button>
        <button class="btn-delete" (click)="deleteCategory(cat.id!)">🗑️ Delete</button>
      </div>
    </div>
  </div>
</div>
