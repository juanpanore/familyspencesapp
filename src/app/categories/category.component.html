<div class="category-container">
  <h2>Categories</h2>

  <div class="category-form">
    <h3>{{ isEditing ? 'Edit Category' : 'New Category' }}</h3>
    <form (ngSubmit)="saveCategory()">
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" [(ngModel)]="selectedCategory.name" name="name" required>
      </div>

      <div class="form-group">
        <label for="type">Type:</label>
        <select id="type" [(ngModel)]="selectedCategory.type" name="type" required>
          <option *ngFor="let type of categoryTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="budgetLimit">Budget Limit:</label>
        <input type="number" id="budgetLimit" [(ngModel)]="selectedCategory.budgetLimit" name="budgetLimit">
      </div>

      <div class="form-group">
        <label for="budgetPeriod">Budget Period:</label>
        <select id="budgetPeriod" [(ngModel)]="selectedCategory.budgetPeriod" name="budgetPeriod">
          <option *ngFor="let period of budgetPeriods" [value]="period">{{ period }}</option>
        </select>
      </div>
      
      <div class="form-group">
          <label for="icon">Icon:</label>
          <input type="text" id="icon" [(ngModel)]="selectedCategory.icon" name="icon">
      </div>

      <div class="form-group">
          <label for="color">Color:</label>
          <input type="color" id="color" [(ngModel)]="selectedCategory.color" name="color">
      </div>

      <button type="submit">{{ isEditing ? 'Update' : 'Create' }}</button>
      <button type="button" (click)="cancelEdit()" *ngIf="isEditing">Cancel</button>
    </form>
  </div>

  <div class="category-list">
    <h3>Existing Categories</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Limit</th>
          <th>Period</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories">
          <td>
              <span [style.color]="cat.color">{{ cat.icon }}</span> {{ cat.name }}
          </td>
          <td>{{ cat.type }}</td>
          <td>{{ cat.budgetLimit }}</td>
          <td>{{ cat.budgetPeriod }}</td>
          <td>
            <button (click)="selectCategory(cat)">Edit</button>
            <button (click)="deleteCategory(cat.id!)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
